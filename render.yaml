# Render Blueprint for the Mediigo frontend.
#
# A Web Service rather than a Static Site on purpose: server.js proxies /api
# and /socket.io to the backend, keeping the browser same-origin so the
# httpOnly refresh cookie stays first-party.
#
# Note: if the service was first created by hand in the dashboard, those manual
# settings keep winning until it is synced as a Blueprint.
services:
  - type: web
    name: mediigo-fe
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Deliberately DB-free and declared before the proxy, so a backend outage
    # never marks the frontend itself unhealthy.
    healthCheckPath: /healthz
    envVars:
      # package.json asks for >=20, which Render resolves to the newest major
      # (Node 26) — untested here. Pin to current LTS.
      - key: NODE_VERSION
        value: "22"
      - key: API_PROXY_TARGET
        value: https://darkslategrey-penguin-138082.hostingersite.com
      # Free tier spins down after ~15 min idle; server.js pings the backend's
      # /healthz on this interval to keep it warm. Set ENABLED=false on a paid
      # instance. NOTE: this only keeps the BACKEND awake — a service cannot
      # ping itself awake, so keeping THIS one warm needs an external monitor
      # on /healthz. See README.
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL_MS
        value: "600000"
      # Build-time and PUBLIC: inlined into the bundle. Restrict it by HTTP
      # referrer in the Google Cloud console, not by hiding it.
      - key: VITE_GMAPS_KEY
        sync: false
      # The browser calls the API DIRECTLY rather than via server.js's /api
      # proxy. Cloudflare fronts this Render service and was rate-limiting real
      # browsers by IP — returning 429s our Express app cannot produce, since it
      # has no rate limiter left. Going direct takes that layer out of the API
      # path entirely.
      #
      # This makes API calls cross-origin, so the backend sets its refresh
      # cookie SameSite=None; Secure and echoes the CORS origin with
      # credentials. Both are already deployed.
      - key: VITE_API_URL
        value: https://darkslategrey-penguin-138082.hostingersite.com
      - key: VITE_SOCKET_URL
        value: https://darkslategrey-penguin-138082.hostingersite.com
      # VITE_PORTAL is absent: unset serves every role from one login.
